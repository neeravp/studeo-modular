name: Bug report
description: Report something that does not behave as documented
body:
  - type: markdown
    attributes:
      value: |
        This package is published for its maintainer's own use and offered as-is. Issues may go unanswered. A report with a minimal reproduction is the only kind that can be acted on.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest steps, command or code that show the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Package, PHP and Laravel versions
    validations:
      required: true
