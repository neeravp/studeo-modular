name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner image for this manual run (pushes always use ubuntu-24.04)
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - ubuntu-latest

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, curl, zip, sqlite3, pdo_sqlite, bcmath, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint --test
        if: matrix.php == '8.4'
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - run: php -d memory_limit=1G vendor/bin/pest

  vue:
    name: Vue group
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, sqlite3, pdo_sqlite, bcmath, intl
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: php -d memory_limit=1G vendor/bin/pest --group=vue --fail-on-skipped
